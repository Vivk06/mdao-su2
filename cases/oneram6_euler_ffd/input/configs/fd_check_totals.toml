# Self-contained resolved configuration. Do not add include.

schema_version = 1
name = "oneram6_check_totals"

[case]
name = "oneram6_euler_ffd"
root = "cases/oneram6_euler_ffd"
ndim = 3
mesh = "input/mesh/mesh_ONERAM6_inv_FFD.su2"

[case.physics]
kind = "euler"

[[case.boundary]]
markers = ["UPPER_SIDE"]
bc = "euler"
roles = ["design", "monitor", "plot", "deform"]

[[case.boundary]]
markers = ["LOWER_SIDE"]
bc = "euler"
roles = ["design", "monitor", "plot", "deform"]

[[case.boundary]]
markers = ["TIP"]
bc = "euler"
roles = ["design", "monitor", "plot", "deform"]

[[case.boundary]]
markers = ["XNORMAL_FACES"]
bc = "far"
roles = []

[[case.boundary]]
markers = ["ZNORMAL_FACES"]
bc = "far"
roles = []

[[case.boundary]]
markers = ["YNORMAL_FACE"]
bc = "far"
roles = []

[[case.boundary]]
markers = ["SYMMETRY_FACE"]
bc = "sym"
roles = ["deform"]

[case.reference]
origin_moment = [0.2015, 0.0, 0.0]
length = 0.64607
area = 0.0

[case.freestream]
temperature = 288.15
pressure = 101325.0
dimensionalization = "FREESTREAM_PRESS_EQ_ONE"

[geometry]
ffd = "wing"
ffd_order = "bezier"
zspan = 0.5

[geometry.ffd_files]
wing = "input/ffd/ffd_oneram6_wing.xyz"

[trim]
dcl_da_init = 0.1
# explicit: an enabled block states every value it uses
enabled = true
max_iter = 6
tol = 0.0001
alpha_clip = [0.0, 5.0]

[solver]
[solver.numerics]
num_method_grad = "GREEN_GAUSS"
cfl_number = 7.5
conv_method_flow = "JST"
jst_sensor_coeff = "( 0.5, 0.02 )"
time_discre_flow = "EULER_IMPLICIT"

[solver.linear]
solver = "FGMRES"
prec = "ILU"
error = 1e-06
iter = 2

[solver.convergence]
startiter = 25
cauchy_elems = 100
cauchy_eps = 1e-10

[solver.primal]
iter = 6000
mglevel = 0
cfl_adapt = false
conv_residual_minval = -12
warm_start = false

[solver.adjoint]
iter = 6000
mglevel = 0
conv_residual_minval = -12

[constraints]
geometry = false

[constraints.thickness]
enabled = false
stations = [[0.0, 0.077], [0.2, 0.072], [0.4, 0.066], [0.6, 0.06], [0.8, 0.054]]

[constraints.lift]
enabled = true
kind = "equals"
equals = 0.286
# explicit: an enabled block states every value it uses
scaler = 1.0

[[points]]
id = "m6"
mach = 0.8395
weight = 1
aoa_init = 3.06
# explicit: an enabled block states every value it uses
aoa_upper = 5.0

[dv]
[dv.shape]
pattern = "ffd3d"
direction = "z"
link_k = false
bound = 1000.0
scaler = "auto"
freeze_i = [1, 2, 3, 4, 6, 7, 8, 9, 10]
freeze_j = [1, 2, 3, 4, 5, 6, 7]
freeze_k = []
# explicit: an enabled block states every value it uses
enabled = true

[objective]
expression = "wsum(drag)"
scaler = 100.0

[optimizer]
name = "SLSQP"

[deform]
linear_solver = "FGMRES"
linear_solver_iter = 500
linear_solver_error = 1e-14
stiffness_type = "WALL_DISTANCE"

[execution]
task = "check_totals"
adjoint_restart = false
derivative_mode = "rev"

[verification]
# Acceptance bands match code defaults so reported verdicts reproduce.
alpha_band = 0.0001
shape_band_floor = 0.001
shape_band_slope = 0.002
cancellation_cr_param = "wing"

[verification.cancellation_cr]
C_D = [239.3, 33.2, 9.1, 4.3, 2.4, 2.4, 34.0, 6.7]
C_L = [35.0, 12.8, 14.9, 19.8, 1.9, 2.1, 6.1, 4.9]

[output]
on_exists = "fail"
