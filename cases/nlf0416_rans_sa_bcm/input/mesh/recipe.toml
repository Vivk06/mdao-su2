# run/mesh.py recipe for the NLF(1)-0416 SA-BCM runs (first-order Roe at Re 6e6 on L3): extract the tutorial wall, then the mesh2d L1-L3 family.
# Levels scale in-plane sizes, first cell and (growth - 1) by sqrt(2) per level.
# Regenerate: python run/mesh.py all --config <this file> --level all
# Source: nlf0416_grid.su2 is the su2code/Tutorials Langtry_and_Menter/NLF mesh (grid.su2; upstream commit and license not identified, taken in at intake 2026-09-24); the L1-L3 meshes and surfaces are generated here.

[mesh.outputs]
case = "nlf0416"
set = "mesh2d"
extract = "../geom/{case}_surface.dat"
surface = "../geom/{case}_surface_{set}_{level}.dat"
mesh = "{case}_{set}_{level}.su2"

[mesh.extract]
enabled = true
mesh = "nlf0416_grid.su2"
markers = ["upper", "lower"]

[mesh.airfoil]
enabled = true
source = "../geom/nlf0416_surface.dat"
spacing = "polynomial"
te = "keep"

[mesh.airfoil.levels.l1]
n_points = 567

[mesh.airfoil.levels.l2]
n_points = 801

[mesh.airfoil.levels.l3]
n_points = 1133

# BL block 0.03 c at every level. The gates keep a margin below skewness 0.85 and
# aspect-ratio p99 3000; gmsh can return another mesh for the same input
# Gmsh may return a different mesh in a fresh process, so mesh2d regenerates, up to `attempts` times, until they pass.
[mesh.mesh2d]
enabled = true
attempts = 5
bl_thickness = 0.03
fan_angle_deg = 60.0
fan_elements = 7
farfield_radius = 100.0
farfield_meshsize = 10.0
wall_meshsize = 0.0
wall_marker = "Airfoil"
farfield_marker = "Farfield"
farfield_center = [0.5, 0.0]

[mesh.mesh2d.quality]
min_first_cell_height_ratio = 0.5
max_first_cell_height_ratio = 2.0
min_bl_thickness_ratio = 0.5
max_bl_thickness_ratio = 2.0
max_skewness = 0.80
max_aspect_ratio_p99 = 1000.0

[mesh.mesh2d.levels.l1]
first_cell_height = 7.07e-6
growth_ratio = 1.1414
near_meshsize = 0.00566
far_growth_slope = 0.0707

# First cell 5e-6 c gives y+ ~0.8 at Re 4e6.
[mesh.mesh2d.levels.l2]
first_cell_height = 5.0e-6
growth_ratio = 1.1
near_meshsize = 0.004
far_growth_slope = 0.05

[mesh.mesh2d.levels.l3]
first_cell_height = 3.54e-6
growth_ratio = 1.0707
near_meshsize = 0.00283
far_growth_slope = 0.0354
