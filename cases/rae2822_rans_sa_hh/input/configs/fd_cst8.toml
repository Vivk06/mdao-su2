# Self-contained resolved configuration. Do not add include.

schema_version = 1
name = "sp_cst8_check_totals"

[case]
name = "rae2822_rans_sa_hh"
root = "cases/rae2822_rans_sa_hh"
ndim = 2
mesh = "input/mesh/mesh_RAE2822_turb.su2"

[[case.boundary]]
markers = ["AIRFOIL"]
bc = "heatflux"
value = 0.0
roles = ["design", "monitor", "plot", "deform"]

[[case.boundary]]
markers = ["FARFIELD"]
bc = "far"
roles = []

[case.reference]
origin_moment = [0.25, 0.0, 0.0]
length = 1.0
area = 1.0

[case.freestream]
temperature = 288.15
reynolds_number = "9.0E6"
reynolds_length = 1.0

[geometry]
zspan = 0.5
parameterization = "cst"
dat_file = "input/geom/rae2822_surface.dat"
n_cst = 8


[constraints]
geometry = true

[constraints.thickness]
stations = [[0.35, 0.1204], [0.96, 0.005], [0.99, 0.0012]]
# explicit: an enabled block states every value it uses
enabled = true
axes = "chord_zspan"
nSpan = 2
nChord = 2
scaled = false
te_offset = 0.05

[constraints.lift]
enabled = true
kind = "equals"
equals = 0.733
# explicit: an enabled block states every value it uses
scaler = 1.0

[[points]]
id = "sp0"
mach = 0.74
weight = 1
aoa_init = 2.7
# explicit: an enabled block states every value it uses
aoa_upper = 5.0

[dv]
[dv.shape]
bound = 0.1
scaler = "auto"
# explicit: an enabled block states every value it uses
enabled = true

[objective]
expression = "wsum(drag)"
scaler = 100.0

[optimizer]
name = "SLSQP"

[optimizer.SLSQP]
MAXIT = 50

[solver]
[solver.primal]
iter = 10000
mglevel = 3
cfl_adapt = true
conv_residual_minval = -11  # -9 left dC_L/dalpha FD noise 4e-4 > 1e-4 band (2026-10-04)
warm_start = false

[solver.linear]
error = "1E-8"
iter = 10

[solver.adjoint]
iter = 30000
mglevel = 0
conv_residual_minval = -7

[solver.adjoint_settings]
relaxation_factor = 0.7

[execution]
task = "check_totals"
adjoint_restart = false
derivative_mode = "rev"

[verification]
# Acceptance bands match code defaults so reported verdicts reproduce.
alpha_band = 0.0001
shape_band = 0.05
shape_step = 1e-06
alpha_step = 0.002  # 2e-3 deg doubles the C_L change the alpha FD resolves
form = "central"
step_calc = "abs"

[trim]
# explicit: an enabled block states every value it uses
enabled = true
max_iter = 6
tol = 0.0001
dcl_da_init = 0.11
alpha_clip = [0.0, 5.0]

[constraints.volume]
# explicit: an enabled block states every value it uses
enabled = true
le_x = 0.01
te_x = 0.99
nSpan = 2
nChord = 10
lower = 1.0

[constraints.le_radius]
# explicit: an enabled block states every value it uses
enabled = true
le_x = 0.01
nSpan = 2
lower = 0.8
axis = [0.0, 1.0, 0.0]
chord_dir = [-1.0, 0.0, 0.0]

[output]
on_exists = "fail"
